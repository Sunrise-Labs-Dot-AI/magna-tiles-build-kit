<script>
(() => {
  const root = document.getElementById('measured-folding-20260928');
  const data = JSON.parse(root.querySelector('[data-motion]').textContent);
  const slider = root.querySelector('#fold-time-20260928');
  const value = root.querySelector('#fold-time-value-20260928');
  const play = root.querySelector('[data-play]');
  const announcement = root.querySelector('[data-announcement]');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const svgs = [...root.querySelectorAll('[data-scene]')];
  const colors = ['var(--viz-series-1)', 'var(--viz-series-2)', 'var(--viz-series-3)'];
  const points = data.rows.flatMap(row => row.samples.flatMap(sample => sample.panels.flat()));
  const xs = points.filter((_,i) => i % 2 === 0), zs = points.filter((_,i) => i % 2 === 1);
  const bounds = {xmin:Math.min(...xs),xmax:Math.max(...xs),zmin:Math.min(...zs),zmax:Math.max(...zs)};
  let playing = false, frame = 0, start = 0, initial = 0;
  const stop = () => { playing = false; cancelAnimationFrame(frame); play.textContent = 'Replay'; };
  const selected = () => Number(slider.value);
  function sampleAt(row, time) {
    let found = row.samples[0];
    for (const sample of row.samples) { if (sample.time > time + 0.00001) break; found = sample; }
    if (time >= row.terminalTime - 0.00001) found = row.samples.at(-1);
    return found;
  }
  function draw() {
    const time = selected(); value.textContent = `${time.toFixed(2)} s`;
    data.rows.forEach((row,index) => {
      const svg = svgs[index], width = Math.max(240,svg.parentElement.clientWidth), height = 230;
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`); svg.setAttribute('height',height);
      const scale = Math.min((width-32)/(bounds.xmax-bounds.xmin),(height-32)/(bounds.zmax-bounds.zmin));
      const cx = (bounds.xmin+bounds.xmax)/2, cz = (bounds.zmin+bounds.zmax)/2;
      const sample = sampleAt(row,time);
      const polygons = sample.panels.map((panel,p) => {
        const pairs = [];
        for (let i=0;i<panel.length;i+=2) pairs.push(`${width/2+(panel[i]-cx)*scale},${height/2-(panel[i+1]-cz)*scale}`);
        return `<polygon points="${pairs.join(' ')}" fill="${colors[p]}" fill-opacity="0.75" />`;
      });
      svg.innerHTML = `<title>${row.title}, recorded at ${sample.time.toFixed(3)} seconds</title>${polygons.join('')}`;
      const stopped = row.failed && time >= row.terminalTime;
      root.querySelector(`[data-status="${index}"]`).textContent = stopped
        ? 'Stopped: panels overlap at 74.76°'
        : time >= 10.1 ? 'Fold completed: 120° · no overlap' : `Recorded at ${sample.time.toFixed(2)} s`;
    });
  }
  function persist() {
    window.openai?.setWidgetState?.({modelContent:{selectedTimeSeconds:selected(),comparison:'Original hinge versus experimental surface pivot',seed:0},privateContent:null}).catch(() => {});
  }
  function restore(state) {
    const n = state?.modelContent?.selectedTimeSeconds;
    if (typeof n === 'number' && Number.isFinite(n)) slider.value = Math.max(0,Math.min(10.1,n));
    draw();
  }
  slider.addEventListener('input',() => {stop();draw();persist();});
  slider.addEventListener('change',() => {announcement.textContent = `Simulation time ${selected().toFixed(2)} seconds.`;});
  play.addEventListener('click',() => {
    if (playing) {stop();persist();return;}
    if (reduced.matches) {slider.value='0';draw();persist();announcement.textContent='Replay paused at the beginning. Use the time slider.';return;}
    if (selected() >= 10.1) slider.value='0';
    playing=true;play.textContent='Pause';start=performance.now();initial=selected();
    const tick = now => {
      if (!playing) return;
      slider.value=Math.min(10.1,initial+(now-start)/1000).toFixed(2);draw();
      if (selected()>=10.1) {stop();persist();announcement.textContent='Replay complete.';} else frame=requestAnimationFrame(tick);
    };
    frame=requestAnimationFrame(tick);
  });
  addEventListener('openai:set_globals',event => {
    if (event.detail?.globals && 'widgetState' in event.detail.globals) {stop();restore(event.detail.globals.widgetState);}
  });
  new ResizeObserver(draw).observe(root);
  restore(window.openai?.widgetState);
})();
