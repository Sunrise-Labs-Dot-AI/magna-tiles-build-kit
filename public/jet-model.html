<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jet reconstruction — 3D model</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef2f6; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 12px; left: 12px; padding: 8px 12px; background: rgba(255,255,255,0.85);
          border-radius: 8px; font-size: 13px; color: #333; line-height: 1.5; }
  #info b { color: #111; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div id="info">
  <b>Jet reconstruction</b> (from video frames) — drag to rotate, scroll to zoom<br/>
  <span class="sw" style="background:#1e6eb4"></span>fuselage
  <span class="sw" style="background:#78c8e6"></span>nose
  <span class="sw" style="background:#e1466e"></span>wing
  <span class="sw" style="background:#14c896"></span>tail
  <span class="sw" style="background:#8c46c8"></span>fin
</div>
<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.160.0",
  "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const TRIS = [{"a":[0,2.598076211353316,-1.5],"b":[3,2.598076211353316,-1.5],"c":[3,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[0,2.598076211353316,-1.5],"b":[3,2.598076211353316,1.5],"c":[0,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[0,2.598076211353316,-1.5],"b":[3,2.598076211353316,-1.5],"c":[3,0,0],"color":"#1e6eb4"},{"a":[0,2.598076211353316,-1.5],"b":[3,0,0],"c":[0,0,0],"color":"#1e6eb4"},{"a":[0,2.598076211353316,1.5],"b":[3,2.598076211353316,1.5],"c":[3,0,0],"color":"#1e6eb4"},{"a":[0,2.598076211353316,1.5],"b":[3,0,0],"c":[0,0,0],"color":"#1e6eb4"},{"a":[3,2.598076211353316,-1.5],"b":[6,2.598076211353316,-1.5],"c":[6,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[3,2.598076211353316,-1.5],"b":[6,2.598076211353316,1.5],"c":[3,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[3,2.598076211353316,-1.5],"b":[6,2.598076211353316,-1.5],"c":[6,0,0],"color":"#1e6eb4"},{"a":[3,2.598076211353316,-1.5],"b":[6,0,0],"c":[3,0,0],"color":"#1e6eb4"},{"a":[3,2.598076211353316,1.5],"b":[6,2.598076211353316,1.5],"c":[6,0,0],"color":"#1e6eb4"},{"a":[3,2.598076211353316,1.5],"b":[6,0,0],"c":[3,0,0],"color":"#1e6eb4"},{"a":[6,2.598076211353316,-1.5],"b":[9,2.598076211353316,-1.5],"c":[9,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[6,2.598076211353316,-1.5],"b":[9,2.598076211353316,1.5],"c":[6,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[6,2.598076211353316,-1.5],"b":[9,2.598076211353316,-1.5],"c":[9,0,0],"color":"#1e6eb4"},{"a":[6,2.598076211353316,-1.5],"b":[9,0,0],"c":[6,0,0],"color":"#1e6eb4"},{"a":[6,2.598076211353316,1.5],"b":[9,2.598076211353316,1.5],"c":[9,0,0],"color":"#1e6eb4"},{"a":[6,2.598076211353316,1.5],"b":[9,0,0],"c":[6,0,0],"color":"#1e6eb4"},{"a":[9,2.598076211353316,-1.5],"b":[12,2.598076211353316,-1.5],"c":[12,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[9,2.598076211353316,-1.5],"b":[12,2.598076211353316,1.5],"c":[9,2.598076211353316,1.5],"color":"#1e6eb4"},{"a":[9,2.598076211353316,-1.5],"b":[12,2.598076211353316,-1.5],"c":[12,0,0],"color":"#1e6eb4"},{"a":[9,2.598076211353316,-1.5],"b":[12,0,0],"c":[9,0,0],"color":"#1e6eb4"},{"a":[9,2.598076211353316,1.5],"b":[12,2.598076211353316,1.5],"c":[12,0,0],"color":"#1e6eb4"},{"a":[9,2.598076211353316,1.5],"b":[12,0,0],"c":[9,0,0],"color":"#1e6eb4"},{"a":[12,2.598076211353316,-1.5],"b":[12,2.598076211353316,1.5],"c":[19.5,0.4,0],"color":"#78c8e6"},{"a":[12,2.598076211353316,-1.5],"b":[12,0,0],"c":[19.5,0.4,0],"color":"#78c8e6"},{"a":[12,2.598076211353316,1.5],"b":[12,0,0],"c":[19.5,0.4,0],"color":"#78c8e6"},{"a":[11,1.4,-1.2],"b":[3,1.4,-1.2],"c":[7,0.2,-8.5],"color":"#e1466e"},{"a":[3,1.4,-1.2],"b":[2,0.3,-5.949999999999999],"c":[7,0.2,-8.5],"color":"#e1466e"},{"a":[11,1.4,1.2],"b":[3,1.4,1.2],"c":[7,0.2,8.5],"color":"#e1466e"},{"a":[3,1.4,1.2],"b":[2,0.3,5.949999999999999],"c":[7,0.2,8.5],"color":"#e1466e"},{"a":[5,2.598076211353316,0],"b":[1.5,2.598076211353316,0],"c":[3.5,6.598076211353316,0],"color":"#14c896"},{"a":[3,2.598076211353316,0],"b":[0,2.598076211353316,0],"c":[1,5.998076211353316,0],"color":"#14c896"},{"a":[0,2.598076211353316,-1.2],"b":[3,2.598076211353316,-1.2],"c":[0.5,2.898076211353316,-4],"color":"#14c896"},{"a":[0,2.598076211353316,1.2],"b":[3,2.598076211353316,1.2],"c":[0.5,2.898076211353316,4],"color":"#14c896"},{"a":[7,2.598076211353316,0],"b":[4.5,2.598076211353316,0],"c":[6,4.998076211353316,0],"color":"#8c46c8"}];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);

// Build geometry grouped by color for clean materials.
const byColor = new Map();
for (const t of TRIS) {
  if (!byColor.has(t.color)) byColor.set(t.color, []);
  byColor.get(t.color).push(t);
}
const group = new THREE.Group();
const box = new THREE.Box3();
for (const [color, ts] of byColor) {
  const positions = [];
  for (const t of ts) { positions.push(...t.a, ...t.b, ...t.c); }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geom.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.55, metalness: 0.05, transparent: true, opacity: 0.92 });
  const mesh = new THREE.Mesh(geom, mat);
  group.add(mesh);
  // edges
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geom, 1), new THREE.LineBasicMaterial({ color: 0x223344, transparent: true, opacity: 0.25 }));
  group.add(edges);
  geom.computeBoundingBox();
  box.union(geom.boundingBox);
}
scene.add(group);

// Center the group at origin.
const center = new THREE.Vector3();
box.getCenter(center);
group.position.sub(center);

const size = new THREE.Vector3();
box.getSize(size);
const radius = size.length() / 2;

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(1, 1.4, 0.8);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
dir2.position.set(-0.8, 0.5, -1);
scene.add(dir2);

const grid = new THREE.GridHelper(radius * 6, 24, 0xbbc4cc, 0xd2d9e0);
grid.position.y = -radius;
scene.add(grid);

camera.position.set(radius * 1.8, radius * 1.3, radius * 2.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
